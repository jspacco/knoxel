plugins {
    id 'java'
    id 'application'
}

group = 'edu.knox.knoxel'
version = '0.0.1'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.google.code.gson:gson:2.10.1'
}

application {
    mainClass = 'edu.knox.knoxel.TerpTest'
}

// task to generate sample JSON files into ../samples/
tasks.register('generateSamples', JavaExec) {
    group = 'knoxel'
    description = 'Generate sample JSON files into ../samples/'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'edu.knox.knoxel.TerpTest'
}

