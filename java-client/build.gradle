// Build a fat jar (with gson bundled) for student distribution
tasks.register('clientJar', Jar) {
    group = 'knoxel'
    description = 'Fat jar with gson bundled for student distribution'
    archiveBaseName = 'knoxel-client'
    from sourceSets.main.output
    from configurations.runtimeClasspath.collect { 
        it.isDirectory() ? it : zipTree(it) 
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    // manifest {
    //     attributes 'Main-Class': 'edu.knox.knoxel.TerpTest'
    // }
}