name: Release

# Triggers when you push a version tag: git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write    # needed to create releases and upload assets

jobs:
  release:
    runs-on: macos-latest  # cross-compiles all three targets from one host

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Node.js (for client build + pkg) ────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'        # matches pkg target version
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      # ── Install root dependencies (pkg lives here) ───────────────────────────
      - name: Install root dependencies
        run: npm install

      # ── Install client dependencies ──────────────────────────────────────────
      - name: Install client dependencies
        run: npm install
        working-directory: client

      # ── Build client → server/pb_public ─────────────────────────────────────
      - name: Build client
        run: scripts/build.sh
        env:
          VITE_POCKETBASE_URL: ''

      # ── Import Apple Developer Certificate & Intermediate CA ─────────────────
      - name: Import Apple Developer certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # 1. Base64 decode p12 cert
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12

          # 2. Create and unlock temporary keychain
          security create-keychain -p "temp-keychain-password" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "temp-keychain-password" build.keychain
          security set-keychain-settings -lut 21600 build.keychain

          # 3. Download & Import Apple Developer ID Intermediate Certificate (Fixes chain error)
          curl -O https://www.apple.com/certificateauthority/DeveloperIDCA.cer
          security import DeveloperIDCA.cer -k build.keychain -T /usr/bin/codesign

          # 4. Import Developer ID p12 certificate
          security import certificate.p12 -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          # 5. Allow codesign tool access without GUI prompt
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "temp-keychain-password" build.keychain

          # Cleanup cert files
          rm certificate.p12 DeveloperIDCA.cer

      # ── Build distribution zips (all three targets) ──────────────────────────
      - name: Build distribution zips
        run: scripts/package.sh mac-arm64 windows-x64 linux-x64

      # ── Sign macOS Binaries Inside the Archive ────────────────────────────────
      - name: Sign macOS binaries
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Extract mac archive to sign contents directly
          mkdir -p dist/mac-temp
          unzip dist/knoxel-mac-arm64.zip -d dist/mac-temp/

          # Sign all executable binaries inside the unzipped folder
          find dist/mac-temp -type f \( -name "knoxel-server" -o -name "pocketbase" -o -name "*.command" \) -exec \
            codesign --force --options runtime --deep --verbose \
            --sign "Developer ID Application: jaime spacco ($APPLE_TEAM_ID)" {} +

          # Re-zip the signed contents back to dist/knoxel-mac-arm64.zip
          cd dist/mac-temp
          zip -r ../knoxel-mac-arm64.zip .
          cd ../..
          rm -rf dist/mac-temp

      # ── Notarize the macOS Zip ────────────────────────────────────────────────
      - name: Notarize macOS ZIP
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool submit dist/knoxel-mac-arm64.zip \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait \
            --timeout 10m

      # ── Verify zips were created ─────────────────────────────────────────────
      - name: List dist/ artifacts
        run: ls -lh dist/

      # ── Create GitHub Release and upload zips ────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Knoxel ${{ github.ref_name }}
          body: |
            ## Knoxel ${{ github.ref_name }}

            ### Downloads

            | Platform | File |
            |---|---|
            | macOS (Apple Silicon) | `knoxel-mac-arm64.zip` |
            | Windows (x64) | `knoxel-windows-x64.zip` |
            | Linux (x64) | `knoxel-linux-x64.zip` |

            ### Installation

            1. Download the zip for your platform
            2. Unzip it
            3. Double-click `start.command` (Mac), `start.bat` (Windows), or run `./start.sh` (Linux)
            4. Follow the first-run prompts to create your admin account and world

            See `README.txt` inside the zip for full instructions.

            ### What's included

            - `knoxel-server` — self-contained startup binary (no Node.js required)
            - `pocketbase` — database server
            - Pre-built web client
            - Database migrations

          files: |
            dist/knoxel-mac-arm64.zip
            dist/knoxel-windows-x64.zip
            dist/knoxel-linux-x64.zip
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}